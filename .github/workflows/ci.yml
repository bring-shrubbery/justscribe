name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Build and test the app
    runs-on: macos-26
    # A green run takes about six minutes; a hung test must fail the job, not sit for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest installed Xcode
        run: |
          # shellcheck disable=SC2012
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers -productVersion
      # The release checks SPARKLE_PRIVATE_KEY with this script; it needs CryptoKit, so it
      # runs here rather than in the Linux scripts job (where the test skips itself).
      - name: Test the Sparkle key check
        run: app/Scripts/release-sparkle-public-key-test.sh
      # mlx-swift compiles Metal shaders; recent Xcode ships the Metal toolchain as a component.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('app/justscribe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # Signed ad hoc: the unit tests run inside the sandboxed app, which must carry its entitlements.
      - name: Build and run the unit tests
        run: |
          set -o pipefail
          xcodebuild -project app/justscribe.xcodeproj -scheme justscribe \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" \
            test -only-testing:justscribeTests 2>&1 | tee build.log | tail -40
      - name: Show the build errors
        if: ${{ !success() }}
        run: |
          [ -f build.log ] || exit 0
          grep -n -E "error:|Test case '.*' failed|\*\* (BUILD|TEST|ARCHIVE) FAILED \*\*" build.log | head -80 || true
      - name: Keep the build log
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Run the script tests
        run: |
          for t in app/Scripts/release-*-test.sh; do
            echo "== $t"; "$t"
          done

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
